name: tests and linting
on:
  push:
    branches:
      - dev
    paths:
      - "packages/*/src/**/*"
      - "packages/*/package.json"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - "!*.md"
      - "!./**/*.md"
      - ".github/workflows/test-unit.yml"
  workflow_dispatch:

env:
  CI: false
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  test:
    runs-on: ubuntu-latest
    name: unit/integration tests and type checking

    steps:
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint
        if: always()

      - name: Check types
        run: pnpm typecheck
        if: always()

      - name: Run tests
        run: pnpm test
        if: always()


